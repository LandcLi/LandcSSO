name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

# 同一分支重复推送时取消上一次未完成的运行，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: golangci-lint
        # 用 go install 固定版本，不用 golangci-lint-action + version: latest。
        #
        # 之前正是 latest 惹的祸：.golangci.yml 是 v1 格式，latest 拉到 v2 后
        # v2 拒绝加载 v1 配置，直接以 exit code 3 失败 —— 看起来像「代码有问题」，
        # 实际是 lint 根本没跑起来。固定版本 + v2 配置后行为可复现。
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -v ./...

      # 显式 CGO_ENABLED=0：发布二进制与生产镜像都是纯静态无 CGO 的，
      # 测试必须跑在同一约束下，否则代码悄悄依赖 cgo 时测试仍会绿。
      - name: Run tests
        env:
          CGO_ENABLED: "0"
        run: go test -v -count=1 -coverprofile=coverage.out ./...

      # -race 需要 CGO，与上面的 CGO off 运行互补：一个对齐产物，一个抓并发缺陷。
      - name: Run tests with race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26.10'
          check-latest: true
