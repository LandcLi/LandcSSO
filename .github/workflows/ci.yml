name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

# 同一分支重复推送时取消上一次未完成的运行，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -v ./...

      # 显式 CGO_ENABLED=0：发布二进制与生产镜像都是纯静态无 CGO 的，
      # 测试必须跑在同一约束下，否则代码悄悄依赖 cgo 时测试仍会绿。
      - name: Run tests
        env:
          CGO_ENABLED: "0"
        run: go test -v -count=1 -coverprofile=coverage.out ./...

      # -race 需要 CGO，与上面的 CGO off 运行互补：一个对齐产物，一个抓并发缺陷。
      - name: Run tests with race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26.10'
          check-latest: true
