server:
  addr: "0.0.0.0"
  port: 8080
  # CORS 白名单：仅允许列出的 Origin 跨域访问，未配置则默认禁止跨域
  cors:
    - "http://localhost:3000"
    - "http://localhost:3001"

database:
  driver: "mysql"
  # 生产环境请使用环境变量注入 DSN，勿写入配置文件
  dsn: "user:password@tcp(127.0.0.1:3306)/sso_db?charset=utf8mb4&parseTime=True&loc=Local"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

jwt:
  # 生产环境推荐使用 RS256 非对称签名算法，避免共享密钥风险
  # 使用 HS256 时请确保 secret 足够复杂（至少 32 个随机字符）
  signingMethod: "RS256"
  secret: "change-me-to-a-random-secret-at-least-32-chars"
  privateKeyPath: "./keys/private.pem"
  publicKeyPath: "./keys/public.pem"
  issuer: "sso-server"
  accessTokenExpiry: 1800
  refreshTokenExpiry: 86400
  maxConcurrentSessions: 5

thirdParty:
  wechat:
    appId: "your-wechat-appid"
    appSecret: "your-wechat-appsecret"
    redirectUri: "http://localhost:8080/auth/third-party-login/callback"
  dingtalk:
    appId: "your-dingtalk-appid"
    appSecret: "your-dingtalk-appsecret"
    redirectUri: "http://localhost:8080/auth/third-party-login/callback"
  github:
    clientId: "your-github-clientid"
    clientSecret: "your-github-clientsecret"
    redirectUri: "http://localhost:8080/auth/third-party-login/callback"
  alipay:
    appId: "your-alipay-appid"
    appSecret: "your-alipay-appsecret"
    redirectUri: "http://localhost:8080/auth/third-party-login/callback"

mail:
  host: "smtp.example.com"
  port: 587
  username: "your-email@example.com"
  password: "your-password"
  from: "your-email@example.com"
  useSSL: false

sms:
  provider: "aliyun"
  apiKey: "your-api-key"
  secretKey: "your-api-secret"
  signName: "your-sign-name"
  templates:
    verifyCode: "SMS_123456789"

log:
  provider: "console"
  level: 1
  format: "text"
  outputPath: "stdout"
