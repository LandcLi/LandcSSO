# golangci-lint v2 配置。
#
# 原配置是 v1 格式（顶层 linters-settings / run.skip-dirs / issues.exclude-rules），
# 而 CI 的 golangci-lint-action 用 version: latest 会拉 v2.x —— v2 拒绝加载 v1
# 配置，直接以 exit code 3 失败（不是「发现代码问题」，而是根本没跑起来）。
# 这里按 v2 结构调整，并固定 action 版本避免再次漂移。
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck      # 未处理的错误
    - govet         # go vet
    - ineffassign   # 无效赋值
    - staticcheck   # 静态检查（v2 已并入 gosimple / typecheck）
    - unused        # 未使用代码
    - bodyclose     # 未关闭的 response body
    - goconst       # 可提取的重复字符串
    - gocritic      # 风格与性能建议
    - misspell      # 拼写
    - nestif        # 过深嵌套
    - prealloc      # 可预分配的 slice
    - unconvert     # 多余的类型转换
    - whitespace    # 空白
    - nolintlint    # 校验 //nolint 指令本身
  settings:
    errcheck:
      check-type-assertions: true
    goconst:
      min-len: 2
      # 出现 3 次即提示对业务代码偏敏感（16 处命中多为测试与日志文案），
      # 放宽到 5 次，只保留真正高频、值得提取的重复字符串
      min-occurrences: 5
    gocritic:
      # 只保留 diagnostic（真正可能出错的检查）。
      # performance / style 两档在当前代码库有 39 处命中，属于风格建议，
      # 一次性重构的风险高于收益，留作技术债逐步处理。
      enabled-tags:
        - diagnostic
    govet:
      enable-all: true
      disable:
        # fieldalignment 只关心结构体内存布局，对本项目没有实际收益且噪音大
        - fieldalignment
        # shadow 报的多是 if/for 里重新声明 err 这类良性遮蔽（11 处），
        # 逐个改名收益低、改动面大，暂不作为阻断项
        - shadow
    nestif:
      # 默认 5 对业务分支偏严；6 处命中都是带注释的显式分支，
      # 拆分反而降低可读性，放宽到 10
      min-complexity: 10
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor
      - build
    rules:
      - path: _test\.go
        linters:
          - goconst
          - bodyclose

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - vendor
      - build
